plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.1.0'
}

group = 'ru.danil.springtech'
version = '0.0.1-SNAPSHOT'
description = 'SpringTech'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis:4.0.6'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:5.0.1'
    implementation 'org.springframework.retry:spring-retry:2.0.12'
    implementation 'org.jobrunr:jobrunr-spring-boot-4-starter:8.6.1'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

openApiGenerate {
    generatorName = "spring"
    inputSpec = file("${projectDir}/src/main/resources/openapi.yaml").absolutePath.replace('\\', '/')
    outputDir = layout.buildDirectory.dir("generated").get().asFile.path

    apiPackage = "ru.danil.springtech.api"
    modelPackage = "ru.danil.springtech.dto"

    configOptions = [
            requestMappingMode: "api_interface",
            skipDefaultInterface: "true",
            documentationProvider: "springdoc",
            library: "spring-boot",
            useTags: "true",
            interfaceOnly: "true",
            useSpringBoot3: "true",
            openApiNullable: "false"
    ]
}

tasks.named("compileJava") {
    dependsOn("openApiGenerate")
}

tasks.named('test') {
    useJUnitPlatform()
}
sourceSets {
    main {
        java {
            srcDirs += layout.buildDirectory.dir("generated/src/main/java").get().asFile.path
        }
        resources {
            srcDirs = ["src/main/resources"]
        }
    }
}

compileJava.dependsOn tasks.openApiGenerate