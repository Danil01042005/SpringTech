spring:
  application:
    name: SpringTest
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  cache:
    type: redis

  datasource:
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 123456
    url: jdbc:postgresql://springTech-postgres:5432/postgres

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

  flyway:
    default-schema: test
    create-schemas: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 15000
    consumer:
      max-poll-records: 100
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "ru.danil.springtech.kafka.dto"
        spring.json.value.default.type: "ru.danil.springtech.kafka.dto.RetryableTaskDTO"
      enable-auto-commit: false
      group-id: springtech-service-group
    listener:
      auto-startup: false


  data:
    redis:
      host: redis
      port: 6379
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [Request-ID: %X{requestId}] - %msg%n"

feign:
  client:
    config:
      medicine-client:
        connectTimeout: 3s
        readTimeout: 3s

api:
  medicine-url: http://medicine:8081/policy

retry-config:
  command-retryable-statuses:
    - 429
    - 500
    - 502
    - 503
    - 504
  command-not-retryable-statuses:
    - 400
    - 401
    - 403
    - 404
  query-retryable-statuses:
    - 429
    - 503
    - 504
  query-not-retryable-statuses:
    - 400
    - 401
    - 403
    - 404
    - 500
  token-budget-key-name: "tokenBudget"
  max-attempts: 2
  delay: 100
  multiplier: 2
  max-capacity: 100
  success-request: 1
  retry-cost: 10

jobrunr:
  background-job-server:
    enabled: false
  dashboard:
    enabled: false

kafka-topic:
  policy-created-topic-name: "policy-created-topic"
  minInsyncReplicas: "1"
  partitions: 3
  replicas: 1

retryable-task-service:
  limit: 100
  retry-delay-seconds: 36000
  processing-lease-seconds: 900
  max-attempts: 3

kafka-listener:
  topic-name-in-policy-created-dlq-handler: "policy-created-dlq"

retryable-task-scheduler:
  fixed-rate: 5000