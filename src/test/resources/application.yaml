spring:
  application:
    name: SpringTest

  cache:
    type: redis

  datasource:
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 123456
    url: jdbc:postgresql://springTech-postgres:5432/postgres

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

  flyway:
    default-schema: test
    create-schemas: true

  data:
    redis:
      host: redis
      port: 6379
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [Request-ID: %X{requestId}] - %msg%n"

feign:
  client:
    config:
      medicine-client:
        connectTimeout: 1s
        readTimeout: 1s

api:
  medicine-url: http://medicine:8081/policy

retry-config:
  max-attempts: 2
  delay: 100
  multiplier: 2
  retry-budget:
    max-capacity: 100
    success-request: 1
    retry-cost: 10

jobrunr:
  background-job-server:
    enabled: false
  dashboard:
    enabled: false