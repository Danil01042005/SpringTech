spring:
  application:
    name: SpringTest

  cache:
    type: redis

  datasource:
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 123456
    url: jdbc:postgresql://springTech-postgres:5432/postgres

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

  flyway:
    default-schema: test
    create-schemas: true

  data:
    redis:
      host: redis
      port: 6379
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [Request-ID: %X{requestId}] - %msg%n"

feign:
  client:
    config:
      medicine-client:
        connectTimeout: 1s
        readTimeout: 1s

api:
  medicine-url: http://medicine:8081/policy

retry-config:
  command-retryable-statuses:
    - 429
    - 500
    - 502
    - 503
    - 504
  command-not-retryable-statuses:
    - 400
    - 401
    - 403
    - 404
  query-retryable-statuses:
    - 429
    - 503
    - 504
  query-not-retryable-statuses:
    - 400
    - 401
    - 403
    - 404
    - 500
  token-budget-key-name: "tokenBudget"
  max-attempts: 2
  delay: 100
  multiplier: 2
  max-capacity: 100
  success-request: 1
  retry-cost: 10

jobrunr:
  background-job-server:
    enabled: false
  dashboard:
    enabled: false

scheduler-config:
  delay: 300000
