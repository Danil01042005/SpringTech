openapi: "3.1.0"
info:
  version: 1.0.0
  title: SpringTech
servers:
  - url: http://localhost:8080

tags:
  - name: user and orders
  - name: Person and passport

paths:
  /user/{id}:
    get:
      summary: Get username by id with his orders
      operationId: getUsernameById
      tags:
        - user and orders
      parameters:
        - name: id
          in: path
          required: true
          description: "ID пользовзателя"
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: get username
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDTO"
        '404':
          description: "User not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /user/create:
    post:
      summary: Create new user
      operationId: createNewUser
      tags:
        - user and orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDTO'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/update/{id}:
    put:
      summary: Update user
      operationId: usernameUpdate
      tags:
        - user and orders
      parameters:
        - name: id
          in: path
          required: true
          description: "ID пользовзателя"
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDTO'
      responses:
        '200':
          description: User was updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDTO"
        '404':
          description: "User not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/delete/{id}:
    delete:
      summary: Delete User
      operationId: deleteUser
      tags:
        - user and orders
      parameters:
        - name: id
          in: path
          required: true
          description: "ID пользовзателя"
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User was deleted
        '404':
          description: "User not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /person/{id}:
    get:
      summary: Get Person with his passport
      operationId: getPerson
      tags:
        - Person and passport
      parameters:
        - name: id
          in: path
          required: true
          description: id человека
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: get person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonDTO"
        '404':
          description: "Person not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /person/create:
    post:
      summary: Create new person
      operationId: createNewPerson
      tags:
        - Person and passport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonDTO'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDTO'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /person/update/{id}:
    put:
      summary: Update person
      operationId: personUpdate
      tags:
        - Person and passport
      parameters:
        - name: id
          in: path
          required: true
          description: "ID человека"
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonDTO'
      responses:
        '200':
          description: Person was updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonDTO"
        '404':
          description: "Person not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /person/delete/{id}:
    delete:
      summary: Delete Person
      operationId: deletePerson
      tags:
        - Person and passport
      parameters:
        - name: id
          in: path
          required: true
          description: "ID человека"
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Person was deleted
        '404':
          description: "Person not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    UserDTO:
      required:
        - username
        - orders
      properties:
        id:
          readOnly: true
          type: string
          format: uuid
        username:
          type: string
          minLength: 2
          maxLength: 30
        orders:
          type: array
          items:
            $ref: '#/components/schemas/OrderDTO'
          default: []
    OrderDTO:
      required:
        - orderDetails
      properties:
        orderDetails:
          type: string
          minLength: 2
          maxLength: 30
          example: "Вишня"
        id:
          readOnly: true
          type: string
          format: uuid

    PersonDTO:
      required:
        - fullName
        - age
        - passport
      properties:
        id:
          readOnly: true
          type: string
          format: uuid
        fullName:
          type: string
          minLength: 4
          maxLength: 40
          example: "Иванов Иван Иванович"
        age:
          type: integer
          minimum: 16
          example: 16
        passport:
          $ref: '#/components/schemas/PassportDTO'
    PassportDTO:
      required:
        - passportNumber
      properties:
        passportNumber:
          type: string
          minLength: 6
          maxLength: 6
          example: "123456"
        id:
          readOnly: true
          type: string
          format: uuid

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        code:
          type: integer